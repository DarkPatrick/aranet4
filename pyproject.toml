[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aranet-monitor"
version = "0.1.0"
description = "Collect Aranet4 readings over Bluetooth into SQLite and show them on an ECharts dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aranet4>=2.4",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aranet-collect = "aranet_monitor.collector:main"
aranet-dashboard = "aranet_monitor.dashboard:main"
aranet-sync = "aranet_monitor.sync:main"
aranet-weather = "aranet_monitor.weather:main"
aranet-dom = "aranet_monitor.dom:main"
aranet-forecast = "aranet_monitor.forecast:main"

[tool.setuptools.packages.find]
include = ["aranet_monitor*"]

[tool.setuptools.package-data]
aranet_monitor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
