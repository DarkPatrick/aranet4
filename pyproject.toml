[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aranet-monitor"
version = "0.1.0"
description = "Collect Aranet4 readings over Bluetooth into SQLite and show them on an ECharts dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aranet4>=2.4",
    "pdfplumber>=0.11",
    "h5py>=3.10",  # lightning: the satellite's NetCDF-4 files
]

[project.optional-dependencies]
test = ["pytest>=8", "openpyxl>=3.1"]
import = ["openpyxl>=3.1"]

[project.scripts]
aranet-collect = "aranet_monitor.collector:main"
aranet-dashboard = "aranet_monitor.dashboard:main"
aranet-sync = "aranet_monitor.sync:main"
aranet-weather = "aranet_monitor.weather:main"
aranet-dom = "aranet_monitor.dom:main"
aranet-forecast = "aranet_monitor.forecast:main"
aranet-import = "aranet_monitor.importer:main"
aranet-uv = "aranet_monitor.uv:main"
aranet-air = "aranet_monitor.air:main"
aranet-era5 = "aranet_monitor.era5:main"
aranet-lightning = "aranet_monitor.lightning:main"
aranet-ai-forecast = "aranet_monitor.ai_forecast:main"

[tool.setuptools.packages.find]
include = ["aranet_monitor*"]

[tool.setuptools.package-data]
aranet_monitor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
